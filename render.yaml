# Render Blueprint - https://render.com/docs/blueprint-spec
# Deploy:  push lên GitHub → vào Render → New → Blueprint → chọn repo
# Hoặc deploy thủ công 2 service riêng theo README.md (phần Deploy)

services:
  # ─── Backend (Web Service - Docker) ─────────────────────────────
  - type: web
    name: water-backend
    runtime: docker
    plan: free
    region: singapore   # gần Việt Nam nhất (oregon | frankfurt | singapore | ohio)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 4000
      - key: APP_VERSION
        value: 1.0.0
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false        # set thủ công sau khi có URL frontend
      - key: DATABASE_URL
        sync: false        # paste connection string từ Neon vào đây
      - key: DB_SSL
        value: 'true'
      - key: JWT_SECRET
        generateValue: true # Render sẽ tự sinh chuỗi random
      - key: SCRAPE_DISABLED
        value: 'true'      # Tránh OOM trên 512MB RAM (đã có data trong DB)

  # ─── Frontend (Static Site) ─────────────────────────────────────
  - type: web
    name: water-frontend
    runtime: static
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false        # set bằng URL của backend service sau khi deploy

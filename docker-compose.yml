services:
  mysql:
    image: mysql:8.4
    container_name: water-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE:      ${DB_NAME:-water_level_db}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [appnet]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: water-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 4000
      APP_VERSION: ${APP_VERSION:-1.0.0}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:5173}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME:     ${DB_NAME:-water_level_db}
      JWT_SECRET:  ${JWT_SECRET:-change-me}
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data
    networks: [appnet]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: water-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks: [appnet]

volumes:
  mysql_data:
  backend_uploads:
  backend_data:

networks:
  appnet:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: water-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB:       ${DB_NAME:-water_level_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-water_level_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [appnet]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: water-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      APP_VERSION: ${APP_VERSION:-1.0.0}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:5173}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER:     ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      DB_NAME:     ${DB_NAME:-water_level_db}
      JWT_SECRET:  ${JWT_SECRET:-change-me}
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/uploads
    networks: [appnet]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: water-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks: [appnet]

volumes:
  pg_data:
  backend_uploads:

networks:
  appnet:
    driver: bridge

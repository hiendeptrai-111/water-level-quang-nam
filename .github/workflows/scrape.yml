name: Scrape water level (hourly)

on:
  schedule:
    # Chạy 2 lần/giờ tại phút :00 và :30.
    # Lý do: trang PCTT publish bản ghi mỗi giờ với delay 5-20 phút sau mốc giờ.
    # Nếu chỉ chạy :00, data luôn trễ ~1 tiếng (vì lúc 13:00 chưa có bản ghi 13:00).
    # Chạy thêm :30 → đảm bảo bắt được data mới ngay khi PCTT publish.
    - cron: '*/30 * * * *'

  # Cho phép chạy thủ công từ GitHub UI (Actions tab → Run workflow)
  workflow_dispatch:

# Tránh chạy chồng nếu lần trước chưa xong
concurrency:
  group: scrape-water
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape & save to Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Cache Chromium do Puppeteer download (~150MB) để tránh re-download mỗi run
      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        run: npm ci

      - name: Run scrape job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: 'true'
          NODE_ENV: production
        run: node scripts/scrape-once.js
